<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ThinkFirst AI - A critical thinking and writing skills development platform for students.">
    <meta name="theme-color" content="#4f46e5">
    <title>ThinkFirst AI — Critical Thinking & Writing Skills Platform</title>
    
    <!-- CSS Styles & Accessibility Improvements -->
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f9fafb;
            --text-color: #111827;
            --card-bg: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #4338ca;
        }

        button:focus, textarea:focus {
            outline: 3px solid #a5b4fc;
        }

        .output-box {
            margin-top: 1.5rem;
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 6px;
            border-left: 4px solid var(--primary-color);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: #6b7280;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <header role="banner">
        <h1>ThinkFirst AI</h1>
        <p>Enhance Independent Writing & Critical Thinking Skills</p>
    </header>

    <main id="main-content" role="main">
        <section class="card" aria-labelledby="prompt-section-heading">
            <h2 id="prompt-section-heading">Practice Workspace</h2>
            <form id="ai-form" onsubmit="event.preventDefault(); handlePromptSubmit();">
                <label for="user-prompt">Enter your thought or argument to analyze:</label>
                <textarea 
                    id="user-prompt" 
                    name="userPrompt" 
                    placeholder="Type your essay draft or argument here..." 
                    aria-required="true"
                    required
                ></textarea>
                
                <button type="submit" id="submit-btn" aria-label="Analyze text and get critical feedback">
                    Analyze & Think First
                </button>
            </form>

            <article id="result-container" class="output-box" style="display: none;" aria-live="polite">
                <h3>Critical Analysis & Feedback:</h3>
                <p id="feedback-text">Your feedback will appear here...</p>
            </article>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 ThinkFirst AI. Built for PromptWars Hackathon.</p>
    </footer>

    <script>
        /**
         * Pure JS Handler for ThinkFirst AI Workspace
         * Optimized for lighthouse performance and accessibility
         */
        function handlePromptSubmit() {
            const input = document.getElementById('user-prompt').value.trim();
            const resultBox = document.getElementById('result-container');
            const feedbackText = document.getElementById('feedback-text');

            if (!input) return;

            // Simulated AI Feedback evaluation
            feedbackText.textContent = "Great start! Consider evaluating counter-arguments to strengthen your thesis statements.";
            resultBox.style.display = "block";
        }
    </script>
</body>
</html>
